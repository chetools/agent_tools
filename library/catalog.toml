[[routine]]
id = "multigrid_poisson_cc"
name = "Cell-centred geometric multigrid V-cycle Poisson solver (3D box, WebGPU)"
area = "gpu"
problem_class = "poisson_multigrid_3d"
suitable_for = ["elliptic_pde", "pressure_projection", "neumann_or_periodic", "structured_grid", "singular_poisson"]
equivalent = "scipy.sparse.linalg.spsolve on the 7-point Neumann/periodic Laplacian (null space fixed); pyamg / HYPRE geometric multigrid"
status = "experimental"
version = "0.1.0"
rust = ""
python = "library/python/gpu/multigrid_poisson_cc.py"
wgsl = "library/wgsl/multigrid_poisson_cc.wgsl"
js = "library/js/multigrid_poisson_cc.js"
example = "library/examples/gpu/multigrid_poisson_cc.html"
features = ["periodic_or_wall_z", "zero_flux_xy_walls", "semi_coarsening_z", "residual_history_per_cycle", "optional_rtol_early_stop", "mean_removal_solvability", "nonzero_initial_guess", "embeddable_in_compute_pass"]
units = "h: length (m or any consistent unit); x: [X]; b and residual: [X]/length^2; arrays (NZ,N,N), index (k*N+j)*N+i"
valid_range = "N power of two >= 4, NZ power of two >= 1 (checked, throws). Tested for N 4..64, NZ 1..32. Defaults: cycles 2, nu1 2, nu2 2, ncoarse 40."
verified_rtol = [2e-5, 1e-3]
tests = ["tests/python/test_multigrid_poisson_cc.py", "tests/gpu/multigrid_poisson_cc.test.js"]
source = "chetools/claude cylinder-cavity-3d: web/fv.wgsl (multigrid section), web/fv_gpu.js (levels, V-cycle order), python/fv3d.py (neighbour_sum ... solve_pressure); generalised with own uniform struct, z boundary option, mean-removal kernels. Standard geometric multigrid, e.g. Briggs, Henson & McCormick, A Multigrid Tutorial (2nd ed.)."
notes = "No Rust: the WGSL kernel is the fast implementation and the Python module is the f64 oracle. Red-black colouring by parity of i+j in every layer, Jacobi in z, so z-independent problems stay z-independent for periodic z; with zero-flux z walls they only converge to z-independence. The singular problem needs mean(b) = 0 (mean removal on by default). f32 residual floor is about 1e-6 of |b|, so rtol below about 1e-5 may never be met on the GPU. Measured convergence factor about 0.14 per V-cycle in 3D, 0.065 at NZ = 1. Tolerances: 2e-5 on the solution (relative to max |x|), 1e-3 on the residual history."

[[routine]]
id = "marching_cubes"
name = "Marching cubes isosurface extraction (WebGPU compute)"
area = "gpu"
problem_class = "isosurface_extraction"
suitable_for = ["scalar_field_3d", "regular_grid", "triangle_mesh", "indirect_draw", "noncubic_grid", "periodic_z_optional"]
equivalent = "skimage.measure.marching_cubes"
status = "experimental"
version = "0.1.0"
rust = ""
python = "library/python/gpu/marching_cubes.py"
wgsl = "library/wgsl/marching_cubes.wgsl"
js = "library/js/marching_cubes.js"
example = "library/examples/gpu/marching_cubes.html"
features = ["per_vertex_gradient_normals", "optional_colour_field", "atomic_append_with_capacity_and_overflow_flag", "indirect_draw_args", "noncubic_grid", "periodic_z_optional", "origin_offset"]
units = "h and origin in any consistent length unit (positions use it); iso and field in field units; normals dimensionless; colour field keeps its own units"
valid_range = "nx, ny, nz >= 2; equal spacing h in x, y, z; cells < 2^31; 3*maxTris*32 bytes within the device storage-buffer limit; classic table with a fixed ambiguity choice (no asymptotic decider). GPU tested up to about 28k nodes."
verified_rtol = [1e-6, 1e-5]
tests = ["tests/gpu/marching_cubes.test.js", "tests/python/test_marching_cubes.py"]
source = "chetools/claude cylinder-cavity-3d/web/iso.wgsl (cs_mc, cs_args, grad, fa, fb, wrapk) and web/render.js; case table: Lorensen & Cline, SIGGRAPH 1987, 163-169, in the numbering of P. Bourke, 'Polygonising a scalar field'"
notes = "No Rust: the WGSL kernel is the fast implementation and the Python module is the f64 oracle (it reads the case table from the WGSL file). Triangle order is nondeterministic, so tests compare order-independent quantities. Tolerances: area/volume 1e-6 relative, colour 1e-6, normals 1e-5, vertex Hausdorff 1e-5 h, triangle count exact. Ambiguous cells resolve differently from skimage's default Lewiner method. The case table's licence is not stated in the source; settle it before verification."

[[routine]]
id = "particle_advect_rk2"
name = "Massless particle advection, RK2 midpoint, trilinear cell-centred velocity (WebGPU)"
area = "gpu"
problem_class = "particle_advection"
suitable_for = ["tracers", "streaklines", "gridded_velocity_field", "no_slip_walls", "periodic_z", "many_particles"]
equivalent = "scipy.integrate.solve_ivp (fixed-step midpoint) with scipy.interpolate.RegularGridInterpolator(method='linear') as the velocity"
status = "experimental"
version = "0.1.0"
rust = ""
python = "library/python/gpu/particle_advect_rk2.py"
wgsl = "library/wgsl/particle_advect_rk2.wgsl"
js = "library/js/particle_advect_rk2.js"
example = "library/examples/gpu/particle_advect_rk2.html"
features = ["periodic_z_or_walled_z", "odd_mirror_no_slip_walls", "clamp_with_flags", "wrap_flag", "substep_count_from_umax", "speed_output", "sampling_only_nsub0", "anisotropic_grid_nx_ny_nz"]
units = "lengths (h, positions): any consistent unit, metres in SI; velocity: length/time; dt: time. Velocity layout [c][k][j][i], c = u,v,w along x,y,z. Cell centres at (i+1/2)h."
valid_range = "nx, ny, nz >= 1 (not only powers of two), h > 0; up to 64*maxComputeWorkgroupsPerDimension particles (tested 1e5); grids tested up to 24^3 on the GPU"
verified_rtol = [1e-5, 5e-3]
tests = ["tests/gpu/particle_advect_rk2.test.js", "tests/python/test_particle_advect_rk2.py"]
source = "chetools/claude cylinder-cavity-3d web/trails.wgsl (cs_advect, vel, vg) and web/tracers.js (velAt, rk2); trail storage, drawing, re-seeding, lifetimes, substep schedule and body hiding removed"
notes = "No Rust: the WGSL kernel is the fast implementation and the Python module is the f64 oracle. Out-of-domain particles are clamped to the wall and flagged (bits 1, 2, 4 = x, y, z clamp; 8 = z wrapped), never re-seeded; a clamped particle stays on the wall because the velocity is 0 there. Tolerances: positions 2e-4..5e-3 h depending on substep count (f32 round-off grows along converging paths), |u| 5e-6..2e-3 of the top speed, flags exact. Keep umax*dt/nsub <= 0.5 h (substepCount). nsub = 0 only samples |u|."

[[routine]]
id = "workgroup_reduce"
name = "Workgroup reduction (sum / max / min / max-abs of an f32 array, WebGPU)"
area = "gpu"
problem_class = "array_reduction"
suitable_for = ["f32_array", "arbitrary_length", "scalar_result", "residual_norms", "diagnostics"]
equivalent = "numpy.sum / numpy.max / numpy.min / numpy.abs(x).max; math.fsum as the exact sum"
status = "experimental"
version = "0.1.0"
rust = ""
python = "library/python/gpu/workgroup_reduce.py"
wgsl = "library/wgsl/workgroup_reduce.wgsl"
js = "library/js/workgroup_reduce.js"
example = "library/examples/gpu/workgroup_reduce.html"
features = ["sum", "max", "min", "maxabs", "any_length_n_ge_1", "2d_dispatch_over_65535_workgroups", "result_stays_on_gpu_reduceToBuffer"]
units = "result has the units of the input values; n dimensionless"
valid_range = "n from 1 to 2^32-1 (tested 1 to 1e7; 2D dispatch path tested by lowering maxGroupsX); finite f32 values (NaN gives undefined max/min)"
verified_rtol = [0.0, 1e-6]
tests = ["tests/gpu/workgroup_reduce.test.js", "tests/python/test_workgroup_reduce.py"]
source = "chetools/claude cylinder-cavity-3d web/lbm.wgsl (wg_reduce4, reduce) and web/fv.wgsl (stats, stats_final)"
notes = "No Rust: the WGSL kernel is the fast implementation and the Python module is the f64 oracle. Two passes: 1024 elements per workgroup, then one final workgroup. Sum order differs from numpy, so the sum tolerance (1e-6) is relative to sum(|x|), not |sum|; max/min/maxabs are exact (tolerance 0). Worst-case f32 sum bound about 3.5e-6*sum|x| at n = 1e7 (stated, not measured; measured 1.4e-10)."

[[routine]]
id = "histogram_range"
name = "Robust colour-scale range (max |x|, histogram, percentile) with optional mask (WebGPU)"
area = "gpu"
problem_class = "percentile_range"
suitable_for = ["colour_scale", "heavy_tailed_fields", "masked_regions", "signed_or_unsigned"]
equivalent = "numpy.histogram on sqrt(|x|/max) and numpy.quantile(|x|, pct, method='inverted_cdf')"
status = "experimental"
version = "0.1.0"
rust = ""
python = "library/python/gpu/histogram_range.py"
wgsl = "library/wgsl/histogram_range.wgsl"
js = "library/js/histogram_range.js"
example = "library/examples/gpu/histogram_range.html"
features = ["max_abs", "sqrt_scale_histogram", "percentile_upper_bin_edge", "symmetric_or_unsigned_range", "optional_u32_mask", "nan_inf_skipped", "2d_dispatch", "histogram_readback"]
units = "field values, lo, hi and max in the units of the field; pct a fraction in (0, 1]; counts dimensionless; mask u32 (non-zero = ignored)"
valid_range = "n 1 to 2^32-1 (tested to 4e6; 2D dispatch path tested); nbins >= 1 (default 2048); pct in (0, 1]"
verified_rtol = [0.0, 1e-6]
tests = ["tests/gpu/histogram_range.test.js", "tests/python/test_histogram_range.py"]
source = "chetools/claude cylinder-cavity-3d web/render.wgsl (cs_clear, cs_max, cs_hist, cs_range, counted) and web/render.js; the cylinder in_body test replaced by an optional mask buffer"
notes = "No Rust: the WGSL kernel is the fast implementation and the Python module is the f64 oracle. hi is the upper edge of the percentile's bin, so 0 <= hi - exact percentile <= 2*max/nbins; hi matches the f64 reference to 1e-6 relative, counts exactly unless elements lie within about 1e-6 of a bin edge. A large outlier widens all bins. pct*count is formed in f32: use dyadic pct (0.5, 0.875, ...) when the exact rank matters. The statistic is always |x|."
