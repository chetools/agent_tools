example = "library/examples/rust/pinch_targets.rs"
example_python = "library/examples/python/pinch_targets.py"
features = ["problem_table_cascade","hot_cold_composite_curves_balanced","grand_composite_curve","pinch_hot_temperature"]
units = "temperatures K or degC (one unit for all streams); cp kW/K; heat kW; dt_min K"
verified_rtol = [1e-9, 1e-6]
tests = ["kemp_four_stream_published_targets","25_furman_instances_vs_highs_cascade_lp","25_furman_published_utility_costs","curve_balance_and_minimum_gap","python_vs_rust"]
source = "Linnhoff et al., User Guide on Process Integration (1982); Kemp, Pinch Analysis and Process Integration, 2nd ed. (2007); Letsios, Kouyialis, Misener (2018) benchmark data (Apache-2.0); ported from chetools/claude heat-exchanger-network"
notes = "One hot and one cold utility level (single QH, QC); utility temperatures and forbidden matches are not modelled (22sp-ph of the Furman set differs from its published cost for that reason and is excluded). Hot streams keep their temperatures, cold streams are shifted up by dt_min; t_shifted gives the textbook scale. Only the lowest zero-flow boundary is reported as the pinch; a pinch at the first or last boundary indicates a threshold problem. Isothermal streams carry no duty (split phase changes into small spans). The Kemp numbers (20, 60 kW, pinch 85 C shifted) were taken from the pina package README quoting the book, not from the book. LP/MILP network targets of the source are not ported."

[[routine]]
id = "porous_permeability"
name = "Porous-media permeability and pressure-drop correlations (Kozeny-Carman, Ergun, Gebart, Sangani-Acrivos)"
area = "properties"
problem_class = "property_correlation"
suitable_for = ["packed_bed_pressure_drop","permeability_of_granular_beds","transverse_permeability_of_cylinder_arrays","kozeny_constant_from_measurement"]
equivalent = "none (closed-form correlations)"
status = "experimental"
version = "0.1.0"
rust = "library/rust/src/properties/porous_permeability.rs"
python = "library/python/agent_tools/properties/porous_permeability.py"
example = "library/examples/rust/porous_permeability.rs"
example_python = "library/examples/python/porous_permeability.py"
features = ["kozeny_carman","fit_kozeny_constant","ergun_gradient","gebart_square","gebart_hexagonal","sangani_acrivos_square","nan_outside_domain"]
units = "SI: eps dimensionless; d, 1/a_s in m; k in m^2; U in m/s; mu in Pa s; rho in kg/m^3; -dp/dx in Pa/m"
verified_rtol = [3.7e-16, 4.8e-16]
tests = ["formulas_vs_independently_reimplemented_reference","dilute_sangani_acrivos_vs_hasimoto","gebart_asymptote_near_close_packing","ergun_laminar_turbulent_limits","kozeny_carman_equals_blake_kozeny_ergun_viscous","fit_kozeny_constant_vs_scipy_curve_fit","nan_outside_domain","python_vs_rust"]
source = "Kozeny 1927 (Sitzungsber. Akad. Wiss. Wien IIa 136:271) / Carman 1937 (Trans. Inst. Chem. Eng. 15:150), K = 5; Ergun 1952 (Chem. Eng. Prog. 48(2):89), 150 and 1.75; Gebart 1992 (J. Compos. Mater. 26:1100); Sangani & Acrivos 1982 (Int. J. Multiphase Flow 8:193); Gebart and Sangani-Acrivos constants read from Table 1 of Yazdchi, Srivastava & Luding 2011 (Int. J. Multiphase Flow); ported from chetools/claude porous-media-lbm"
notes = "One family entry: the five functions share conventions (SI units, NaN outside the mathematical domain, no clipping) and one file pair. Reference data are the published formulas re-implemented in a different algebraic form by the generator; no paper table values (none could be verified). Recommended ranges are documented, not enforced: Gebart is a close-packing lubrication model, Sangani-Acrivos a dilute series truncated at O(phi^4) (accuracy at large phi not verified), Ergun's data range not verified. fit_kozeny_constant is an exact per-measurement inversion, not a least-squares fit. Changes from the source: kozeny_carman takes a_s explicitly (the source defaulted to the 2D disk value 4/d) and gebart_hexagonal was added; out-of-domain inputs give NaN."

[[routine]]
id = "rtd_analysis"
name = "Residence-time distribution analysis: moments, tail extrapolation, dispersion and tanks-in-series fits"
area = "stats"
problem_class = "residence_time_distribution"
suitable_for = ["tracer_pulse_response","mean_and_variance_with_truncated_tail","axial_dispersion_Pe","tanks_in_series_N","two_detector_dispersion"]
equivalent = "none in SciPy; comparisons use scipy.optimize.curve_fit and scipy.integrate"
status = "experimental"
version = "0.1.0"
rust = "library/rust/src/stats/rtd_analysis.rs"
python = "library/python/agent_tools/stats/rtd_analysis.py"
example = "library/examples/rust/rtd_analysis.rs"
example_python = "library/examples/python/rtd_analysis.py"
features = ["trapezoid_moments","exponential_tail_extrapolation","square_pulse_correction","tanks_in_series_E","open_open_dispersion_E","closed_closed_variance","moment_fits_Pe_N","least_squares_fits_golden_section","two_plane_dispersion"]
units = "t in s, C any consistent unit, E in 1/s, theta and Pe and N dimensionless"
verified_rtol = [1e-9, 5e-2]
tests = ["moments_vs_scipy_1e-9","tail_extrapolation_exact_exponential","pulse_correction_closed_form","two_plane_exact","moment_inversion_exact","closed_closed_variance_vs_pole_series","lsq_vs_curve_fit_1e-5","noisy_3pct_lsq_vs_moments","failure_modes","python_vs_rust"]
source = "Levenspiel, Chemical Reaction Engineering 3rd ed. ch. 11 and 13; Fogler, Elements of Chemical Reaction Engineering ch. 18-19 (equation numbers not checked); ported from chetools/claude porous-media-lbm (tail_fit, rtd_moments, fit_dispersion, E_dispersion, E_tanks); moment inversions and least-squares fits are new"
notes = "Split decision: one entry, because moments, model curves and fits share the same definitions and are used together. open-open E is the unbounded-medium solution seen as concentration (mean 1+2/Pe, variance 2/Pe+8/Pe^2); closed-closed is provided as moments only (no E curve). Tail extrapolation is exact for exponential tails but overestimates the variance by about 4 % for tanks records cut at 2 tau (gamma tail is not exponential); noisy tails (negative samples) disable it. Moments of noisy records are biased high (27 % in N for 3 % noise), use fit_lsq there. fit_lsq is a nested golden-section search: assumes unimodality, flags a parameter at the edge of [0.05, 1e4]. taylor_aris_plates from the source was not ported (geometry-specific correlation)."

[[routine]]
id = "lhs_maximin"
name = "Maximin Latin hypercube design (best of k random LHS)"
area = "stats"
problem_class = "space_filling_design"
suitable_for = ["initial_design","computer_experiments","surrogate_training_points","bit_identical_across_languages"]
equivalent = "scipy.stats.qmc.LatinHypercube (plain; optimization='random-cd' optimizes discrepancy, not maximin)"
status = "experimental"
version = "0.1.0"
rust = "library/rust/src/stats/lhs_maximin.rs"
python = "library/python/agent_tools/stats/lhs_maximin.py"
example = "library/examples/rust/lhs_maximin.rs"
example_python = "library/examples/python/lhs_maximin.py"
features = ["latin_property","random_position_in_slice","min_distance_reported","seeded_bit_identical"]
units = "dimensionless: points in the unit cube [0,1)^d (scale to physical ranges as lo + x*(hi-lo)); min_distance in unit-cube length"
valid_range = "n >= 1, d >= 1, tries >= 1; tested n = 1..100, d = 1..10, tries up to 200"
verified_rtol = [0, 1e-14]
tests = ["latin_property_n1_to_100_d1_to_10","designs_vs_independent_impl_bit_exact","monotone_in_tries","seed_study_vs_scipy_qmc_n50_d10","python_vs_rust_bit_identical"]
source = "McKay, Beckman & Conover, Technometrics 21 (1979) 239-245 (LHS); Johnson, Moore & Ylvisaker, J. Stat. Plann. Inference 26 (1990) 131-148 (maximin distance designs); Morris & Mitchell, J. Stat. Plann. Inference 43 (1995) 381-402 (maximin criterion; their annealing search is NOT implemented); ported from chetools/claude sequential-design (own code)"
notes = "Plain best-of-k random search, default k = 50 in the source (no default in the Rust signature; pass tries). Points sit at a random, not centred, position in each slice. Pass a SplitMix64 (the source uses from_seed_stream(seed, stream)); the same generator state gives identical designs in Rust and Python. Larger tries never lowers the minimum distance for the same generator state, but the gain is slow: at n = 50, d = 10 the mean min distance is about 0.50 for 1 candidate and 0.63 for 50, while scipy optimization='random-cd' reaches about 0.72 (different criterion, same test seeds). Use Morris-Mitchell style exchange optimization for a real maximin optimum. n = 1 returns min_distance 1.0 by convention."

