[[routine]]
id = "lmtd"
name = "Log-mean temperature difference with partial derivatives"
area = "process"
problem_class = "heat_exchanger_driving_force"
suitable_for = ["heat_exchanger_sizing","gradient_based_network_optimisation"]
equivalent = "none (closed form (a-b)/ln(a/b) without a safe equal-difference limit)"
status = "experimental"
version = "0.1.0"
rust = "library/rust/src/process/lmtd.rs"
python = "library/python/agent_tools/process/lmtd.py"
example = "library/examples/rust/lmtd.rs"
example_python = "library/examples/python/lmtd.py"
features = ["series_branch_near_equal_differences","partial_derivatives_both_terminal_differences","nan_on_nonpositive_input"]
units = "inputs and L in K (any consistent temperature difference); derivatives dimensionless"
verified_rtol = [1e-11, 5e-12]
tests = ["vs_mpmath_50_digits_ratios_1e-6_to_1e6","switch_region_1e-12_to_1e-2","sweep_rel_diff_1e-9_to_2_240_points_5e-12","sweep_ratio_1e-6_to_1e6_241_points_5e-12","finite_differences_both_sides_of_switch","python_vs_rust"]
source = "Kern, Process Heat Transfer (1950); ported from chetools/claude heat-exchanger-network"
notes = "Switch: |dT1-dT2| < 1e-4 * mean uses L ~ m - d^2/(12 m) (and its derivatives); measured errors vs 50-digit values: L 5e-13 relative at the threshold, 2e-16 elsewhere. Just above the switch the closed form uses lr = ln_1p((dT1-dT2)/dT2) for |dT1-dT2| < mean (plain ln(dT1/dT2) cost the derivatives up to 8.2e-9 absolute at |d|/m = 1.08e-4, found in review); measured derivative error now 3.2e-12 relative at worst over 240 log-spaced |d|/m from 1e-9 to 2 (3.8e-13 absolute in the 1e-4..1e-2 straddle group, 1.3e-15 relative over dT1/dT2 from 1e-6 to 1e6). The series branch is accurate to 2e-14 at the threshold. Returns NaN for non-positive or non-finite input (the source did not guard this)."

[[routine]]
id = "hx_capital_cost"
name = "Shell-and-tube exchanger bare-module cost (Seider, Turton) with dC/dA, and capital recovery factor"
area = "process"
problem_class = "equipment_cost_correlation"
suitable_for = ["exchanger_network_cost_optimisation","annualised_capital_cost"]
equivalent = "BioSTEAM HX costing (Seider coefficients), IDAES SSLW costing (Seider, CE 500), eqcost / CAPCOST (Turton)"
status = "experimental"
version = "0.1.0"
rust = "library/rust/src/process/hx_capital_cost.rs"
python = "library/python/agent_tools/process/hx_capital_cost.py"
example = "library/examples/rust/hx_capital_cost.rs"
example_python = "library/examples/python/hx_capital_cost.py"
features = ["seider_floating_fixed_utube","seider_material_pressure_length_factors","turton_floating_head","analytic_dC_dA","area_range_flags","pressure_below_range_flag","capital_recovery_factor"]
units = "area m2; cost USD of the correlation's index year (Seider CE 567, Turton CEPCI 397); dC/dA USD/m2; pressure psig (Seider) or barg (Turton); CRF 1/yr"
verified_rtol = [1e-12, 1e-11]
tests = ["material_pressure_length_tables_vs_idaes_listing","turton_eqcost_case_3e-3","values_and_complex_step_derivatives_324_cases","finite_differences_both_sides_of_clamp","floating_head_intercepts_differ_by_cost_index_shift","unknown_type_value_error","pressure_below_range_flag","crf_vs_mpmath","python_vs_rust"]
source = "Seider, Seader, Lewin, Widagdo et al., Product and Process Design Principles (3rd ed. Eq. 22.43-22.44 per IDAES; equation numbers not checked against the books); Turton et al., Analysis, Synthesis and Design of Chemical Processes, Appendix A; coefficient sets as in chetools/claude heat-exchanger-network (BioSTEAM for Seider, eqcost for Turton)"
notes = "NOT verified against the books: the Seider base-cost coefficients (BioSTEAM, CE 567) and the Turton K, B, C and non-CS F_M. Open items for the maintainer (PR review, no coefficient changed): (1) floating head: BioSTEAM 12.0310 (CE 567) vs IDAES 11.9052 (CE 500) differ by ln(567/500) = 0.1258, so the costs agree to 4.9e-5 after the cost-index shift (tested; not a contradiction); (2) fixed head: slope -0.9228 here (BioSTEAM; a Penn lecture snippet agrees) vs -0.8228 in IDAES, unconfirmed which is right, IDAES probably a typo; (3) U-tube: intercepts differ by 0.1658, more than the index shift (4.1 % cost difference), unresolved; (4) Turton K, C, B confirmed only by a third-party worked example (eqcost), not by the book. Checked: F_M, F_P and F_L against the IDAES listing, Turton CS case against eqcost (1.4e-4 relative in C_BM). Seider F_P is stated valid for 100-2000 psig and is evaluated outside it with unchanged values; seider_pressure_below_range flags P < 100 psig. Seider bare-module rule C_B (F_BM + F_L F_P F_M - 1), F_BM = 3.17, is BioSTEAM's, not a book equation. Seider range 150-12000 ft2 (below: cost of 150 ft2 and slope 0; above: extrapolated, above_range set); Turton range 10-1000 m2, same behaviour. Turton F_M is same-material only. Costs are not escalated: multiply by index_new/index_basis. The capital recovery factor uses log1p/expm1 (differs from the textbook evaluation only in rounding; that evaluation loses 4 digits at i = 1e-12)."

