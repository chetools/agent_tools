tests = ["quadratic_n5_exact","quadratic_n8_cond1e3_cost","rosenbrock_2d","extended_rosenbrock_n10","scaled_valley_a1000","vs_scipy_bfgs_gtol_1e-10","failure_modes","stall_stop","option_validation","ill_conditioned_8_seeds","python_vs_rust_iterates"]
source = "Nocedal & Wright, Numerical Optimization, 2nd ed., Alg. 6.1, eq. 6.17, Alg. 3.1; ported from chetools/claude sequential-design (own code)"
notes = "Unconstrained only (the source's bounds were a problem-specific tanh transform, not ported). Defaults: gtol = 1e-5 (max-norm, strict), max_iter = 200, Armijo c1 = 1e-4, halving until step < 1e-10, update skipped if s.y <= 1e-12 (absolute). Identity initial inverse Hessian. fg may return inf/NaN to reject a trial point. Evaluations (nfev) relative to SciPy (no Wolfe line search): 1.3 to 2.4 times on the four original cases (the 5-D quadratic is the 2.4: 26 vs 11), 2.9 times (50 vs 17, both languages) on the 8-D quadratic with eigenvalues 1 to 1e3 (quadratic8_cond1e3), and a reviewer measured 5 times (80 vs 16) on another such quadratic, so expect up to about 5 times on ill-conditioned quadratics. Line search also accepts a trial point by the Hager-Zhang approximate-Wolfe condition when f is flat to rounding (all 8 seeds of an ill-conditioned 8-D quadratic converge at gtol 1e-10, 16 runs, nit 14 to 17, nfev 49 to 52). Stops with success = false and a message (no progress) if a step leaves x unchanged or max|g| reaches no new low in 20 steps (gtol below attainable accuracy), or if gtol is not finite and > 0 or max_iter < 1. Python and Rust give identical iterates on the Rosenbrock cases and the 5-D quadratic when the objective is summed in the same order (shown in the examples); a different summation order in the objective, such as NumPy's @, gives results that differ in the last digits and may differ in nit."

[[routine]]
id = "gp_matern52"
name = "Gaussian-process regression, Matern-5/2 ARD kernel, maximum-likelihood hyperparameters"
area = "stats"
problem_class = "gaussian_process_regression"
suitable_for = ["surrogate_models","sequential_design","small_n_smooth_responses","uncertainty_of_predictions"]
equivalent = "sklearn GaussianProcessRegressor(Matern(nu=2.5) ARD + WhiteKernel, normalize_y=True)"
status = "experimental"
version = "0.1.0"
rust = "library/rust/src/stats/gp_matern52.rs"
python = "library/python/agent_tools/stats/gp_matern52.py"
example = "library/examples/rust/gp_matern52.rs"
example_python = "library/examples/python/gp_matern52.py"
features = ["ard_length_scales","noise_fitted_or_fixed","bounded_hyperparameters_tanh","multi_start_with_seeded_random_starts","log_marginal_likelihood","predict_mean_variance","posterior_cross_covariance","analytic_nll_gradient"]
units = "x any units (length scales in units of x; default bounds assume x scaled to [0,1]); mean, signal_sd, noise_sd in units of y; variances and covariances in units of y^2"
valid_range = "n up to a few hundred (dense O(n^3)); tested d = 1, 2, 5, n = 8 to 40, cond(K) up to ~1e8"
verified_rtol = [1e-13, 1e-7]
tests = ["kernel_vs_bessel_matern","nll_and_gradient_vs_dense_fd","gradient_central_differences_both_sides","fit_vs_scipy_lbfgsb_three_cases","predict_vs_dense_solve","noise_free_interpolation","hard_d5_n40_close_points_tiny_noise","python_vs_rust"]
source = "Rasmussen & Williams, Gaussian Processes for Machine Learning (2006), eqs. 4.17, 5.8, 5.9, Alg. 2.1; ported from chetools/claude sequential-design (own code)"
notes = "y is standardised (mean, population std); a 1e-8 jitter (standardised variance) is always added to the diagonal. Hyperparameters boxed by a tanh transform (defaults: ell in [0.02, 5] x-units, signal_sd/std(y) in [0.1, 10], noise_sd/std(y) in [1e-3, 1]) and fitted by the library bfgs from starts ell = 0.1, 0.3, 1.0 (+ optional SplitMix64 random starts); best NLL kept. Near a bound the fitted value sits close to, not at, the bound. On ill-conditioned problems BFGS may stop with 'line search failed' at the optimum to rounding (success = false; hard5d Python case)."

