# Catalog of numerical routines in chetools/agent_tools.
#
# Agents: read this file before implementing any numerical routine (see AGENTS.md).
# One [[routine]] table per routine. The library is empty in this draft; the
# commented example shows the schema and is NOT a real routine.
#
# Field reference
#   id              unique snake_case name, also the Rust module and Python file name
#   name            human-readable name
#   area            "ode" | "roots" | "optimize" | "linalg"
#   problem_class   what it solves, e.g. "ivp", "scalar_root", "nonlinear_system",
#                   "unconstrained", "bounded", "constrained", "least_squares"
#   suitable_for    tags such as "stiff", "nonstiff", "dae_index1", "bracketed", "derivative_free"
#   scipy_equivalent  closest SciPy call, for orientation
#   status          "experimental" (agent-added, unreviewed) | "verified" (set only on a maintainer's explicit approval; see AGENTS.md section 5)
#   version         semantic version of the routine
#   rust            path to Rust source
#   python          path to Python reference twin
#   example         path to minimal working example
#   features        optional capabilities, e.g. "dense_output", "events", "analytic_jacobian"
#   verified_rtol   range of relative tolerances the tests cover, [low, high]
#   benchmarks      benchmark problem ids the routine passes
#   source          algorithm reference (book/paper/code), and its license if code was ported
#   notes           anything an agent must know before using it

